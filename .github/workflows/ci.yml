name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    # nutllm uses x86-64 AVX2/FMA intrinsics, so the runner must be x86-64.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y g++ make

      - name: Build (portable flags; warnings are failures)
        run: |
          make clean
          make all ARCH="-mavx2 -mfma" 2>&1 | tee build.log
          ! grep -qi warning build.log

      - name: Correctness gate (every kernel vs the reference)
        run: make test

      - name: Tiny checkpoint generation smoke test
        run: |
          python3 scripts/make_tiny_checkpoint.py
          git diff --exit-code -- tests/fixtures
          output=$(./build/nutllm \
            --model tests/fixtures/tiny.safetensors \
            --vocab tests/fixtures/tiny.vocab \
            --merges tests/fixtures/tiny.merges \
            --prompt H --max-tokens 8)
          test "$output" = "Hi!"
          output=$(./build/nutllm \
            --model tests/fixtures/tiny-llama2.bin \
            --tokenizer tests/fixtures/tiny-llama2.tokenizer \
            --prompt H --max-tokens 8)
          test "$output" = "Hi!"
          for quant in int8 int4; do
            output=$(./build/nutllm \
              --model tests/fixtures/tiny-llama2.bin \
              --tokenizer tests/fixtures/tiny-llama2.tokenizer \
              --prompt H --max-tokens 8 --quant "$quant" --threads 4)
            test "$output" = "Hi!"
          done

      - name: Benchmark (informational — runner speed is not a gate)
        run: make run
